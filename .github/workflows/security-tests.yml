name: Firebase security tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  firestore-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test tools
        run: npm install --no-audit --no-fund
      - name: Check source syntax
        run: npm run test:syntax
      - name: Run public configuration and XSS regression smoke tests
        run: npm run test:smoke
      - name: Test Firestore authorization in emulator
        run: npm run test:rules
